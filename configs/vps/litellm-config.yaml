# LiteLLM proxy config for the LAPAN VPS gateway.
# Upstream is the hospital's ai-api gateway (OpenAI-compatible, with RAG
# citations) exposed tailnet-only via `tailscale serve` on lapan-ai.
#
# Model routing:
#   lapan            -> default chat model at the hospital (switch here when
#                       the benchmark picks the titular model)
#   lapan/<ollama>   -> passthrough to any Ollama model the gateway serves
#                       (e.g. model="lapan/qwen3:8b", "lapan/gpt-oss:20b")

model_list:
  - model_name: lapan
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: os.environ/LAPAN_AI_BASE_URL
      api_key: os.environ/LAPAN_AI_API_KEY

  - model_name: "lapan/*"
    litellm_params:
      model: "openai/*"
      api_base: os.environ/LAPAN_AI_BASE_URL
      api_key: os.environ/LAPAN_AI_API_KEY

litellm_settings:
  # LGPD: never persist prompt/completion content on the VPS; only metadata
  # (model, tokens, timings, virtual key) is stored in Postgres.
  turn_off_message_logging: true
  drop_params: true
  num_retries: 2
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
