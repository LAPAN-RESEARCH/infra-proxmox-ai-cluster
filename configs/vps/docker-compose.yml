# VPS stack (lapan-vps): LiteLLM AI gateway + n8n automation, behind the
# existing Traefik. Reaches the hospital services over the tailnet at
# https://lapan-ai.tailf9eac9.ts.net (tailscale serve, tailnet-only).
#
# Deploy: see configs/vps/README.md. Requires the Traefik external network
# (TRAEFIK_NETWORK, default "traefik_proxy") and HTTPS entrypoint
# (TRAEFIK_ENTRYPOINT, default "websecure").
services:
  postgres:
    image: postgres:16-alpine
    container_name: lapan-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      POSTGRES_USER: lapan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - /srv/vps/postgres/data:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapan -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lapan-vps-net

  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_TAG:-main-stable}
    container_name: lapan-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_URL: postgresql://lapan:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: "True"
      # Hospital gateway credentials (AI_API_KEY from lapan-ai .env).
      LAPAN_AI_API_KEY: ${LAPAN_AI_API_KEY}
      LAPAN_AI_BASE_URL: ${LAPAN_AI_BASE_URL:-https://lapan-ai.tailf9eac9.ts.net/v1}
    ports:
      - "127.0.0.1:4000:4000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}
      - traefik.http.routers.lapan-api.rule=Host(`api.${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.lapan-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.lapan-api.tls=true
      - traefik.http.routers.lapan-api.tls.certresolver=le
      - traefik.http.services.lapan-api.loadbalancer.server.port=4000
      - traefik.http.routers.lapan-api.middlewares=lapan-api-ratelimit
      - traefik.http.middlewares.lapan-api-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.lapan-api-ratelimit.ratelimit.burst=60
    networks:
      - lapan-vps-net
      - ${TRAEFIK_NETWORK:-traefik_proxy}

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_TAG:-latest}
    container_name: lapan-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: lapan
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "true"
      # Local AI models via LiteLLM (use the n8n virtual key, not the master).
      N8N_AI_GATEWAY_BASE_URL: http://litellm:4000/v1
      # Self-hosted Assistant sandbox (internal network only).
      N8N_ENABLED_MODULES: instance-ai
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_INSTANCE_AI_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest
      N8N_SANDBOX_SERVICE_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: ${SANDBOX_API_KEYS}
      # Assistant web search (SearXNG, internal only).
      N8N_INSTANCE_AI_SEARXNG_URL: http://searxng:8080
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}
      - traefik.http.routers.lapan-n8n.rule=Host(`n8n.${DOMAIN}`)
      - traefik.http.routers.lapan-n8n.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.lapan-n8n.tls=true
      - traefik.http.routers.lapan-n8n.tls.certresolver=le
      - traefik.http.services.lapan-n8n.loadbalancer.server.port=5678
    volumes:
      - /srv/vps/n8n/data:/home/node/.n8n
      - /srv/vps/n8n/files:/files
    networks:
      - lapan-vps-net
      - ${TRAEFIK_NETWORK:-traefik_proxy}

  # --- n8n AI Assistant self-hosted sandbox (internal network only) ---
  # Service names are certificate-bound (SANs); do not rename them.
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:latest
    container_name: lapan-sandbox-certs
    user: "0:0"
    entrypoint:
      - /sbin/tini
      - --
      - sh
      - -c
      - bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api --control-sans sandbox-runner-1 && chown -R 100:101 /tls
    environment:
      NUM_RUNNERS: "1"
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls
    networks:
      - lapan-vps-net

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:latest
    container_name: lapan-sandbox-api
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lapan-vps-net

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:latest
    container_name: lapan-sandbox-runner-1
    restart: unless-stopped
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: http://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      - lapan-vps-net

  # --- SearXNG: web search for the n8n AI Assistant (internal only) ---
  searxng:
    image: searxng/searxng:latest
    container_name: lapan-searxng
    restart: unless-stopped
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - lapan-vps-net

  # --- LAPAN MCP server (ChatGPT Developer Mode connectors) ---
  # Prototype: unauthenticated FastMCP on its own path behind Traefik
  # rate-limit; spends are capped by the MCP_LITELLM_KEY virtual key.
  # Upgrade path: FastMCP OAuth (oauth-proxy pattern) if needed.
  mcp:
    build: ./mcp
    container_name: lapan-mcp
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      MCP_LITELLM_KEY: ${MCP_LITELLM_KEY}
      LITELLM_BASE: http://litellm:4000/v1
      MCP_MODEL: lapan
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}
      - traefik.http.routers.lapan-mcp.rule=Host(`api.${DOMAIN:?set DOMAIN in .env}`) && PathPrefix(`/mcp`)
      - traefik.http.routers.lapan-mcp.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.lapan-mcp.tls=true
      - traefik.http.routers.lapan-mcp.tls.certresolver=le
      - traefik.http.services.lapan-mcp.loadbalancer.server.port=8000
      - traefik.http.routers.lapan-mcp.middlewares=lapan-mcp-ratelimit
      - traefik.http.middlewares.lapan-mcp-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.lapan-mcp-ratelimit.ratelimit.burst=20
    networks:
      - lapan-vps-net
      - ${TRAEFIK_NETWORK:-traefik_proxy}

networks:
  lapan-vps-net:
    driver: bridge
  # Must match the Traefik network name on the VPS AND the top-level key here
  # (compose network keys are not interpolated).
  traefik_proxy:
    external: true

volumes:
  sandbox-tls:
