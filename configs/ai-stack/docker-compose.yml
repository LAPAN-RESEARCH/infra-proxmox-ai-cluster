services:
  ollama:
    image: ollama/ollama:${OLLAMA_TAG}
    container_name: ollama
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_MODELS: /root/.ollama/models
    volumes:
      - /srv/ai/ollama:/root/.ollama
    gpus: all
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - lapan-ai-net

  speaches:
    image: ghcr.io/speaches-ai/speaches:${SPEACHES_TAG:-latest-cuda}
    container_name: speaches
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      API_KEY: ${SPEACHES_API_KEY:-}
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
      LOG_LEVEL: info
      ENABLE_UI: "false"
      HF_HUB_CACHE: /home/ubuntu/.cache/huggingface/hub
      STT_MODEL_TTL: "-1"
      VAD_MODEL_TTL: "-1"
      PRELOAD_MODELS: '["${SPEACHES_MODEL:-mobiuslabsgmbh/faster-whisper-large-v3-turbo}"]'
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: float16
    volumes:
      - /srv/ai/models/huggingface:/home/ubuntu/.cache/huggingface/hub
      - /srv/ai/logs/speaches:/srv/ai/logs/speaches
    gpus: all
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - lapan-ai-net

  whisper-livekit:
    build:
      context: /srv/ai/src/whisper-livekit
      args:
        EXTRAS: "cu129,diarization-sortformer"
    container_name: whisper-livekit
    restart: unless-stopped
    # ENTRYPOINT is `wlk --host 0.0.0.0`; compose `command` replaces CMD only.
    command: >
      --port 8000
      --backend faster-whisper
      --model ${WLK_MODEL:-large-v3-turbo}
      --language pt
      --diarization
      --sortformer-max-speakers ${WLK_MAX_SPEAKERS:-2}
      --api-token ${WLK_API_TOKEN}
    environment:
      TZ: ${TZ}
      HF_HUB_CACHE: /root/.cache/huggingface/hub
    volumes:
      - /srv/ai/models/huggingface:/root/.cache/huggingface
    gpus: all
    ports:
      - "127.0.0.1:${WLK_PORT:-8010}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - lapan-ai-net

  escuta:
    build:
      context: ../../services/escuta
      args:
        EXTRAS: ${ESCUTA_EXTRAS:-gpu}
    container_name: escuta
    restart: unless-stopped
    depends_on:
      - ollama
      - speaches
      - whisper-livekit
      - ai-api
    environment:
      TZ: ${TZ}
      ESCUTA_DATA_DIR: /srv/ai/clinical
      ESCUTA_RUN_DIR: /run/escuta
      ESCUTA_ASR_BACKEND: ${ESCUTA_ASR_BACKEND:-http}
      ESCUTA_ASR_URL: http://speaches:8000/v1/audio/transcriptions
      ESCUTA_ASR_MODEL: ${SPEACHES_MODEL:-Systran/faster-whisper-large-v3-turbo}
      ESCUTA_WLK_URL: ws://whisper-livekit:8000/asr
      # Nativo Ollama (think=false p/ extração estruturada; sem RAG no trilho clínico)
      ESCUTA_LLM_URL: ${ESCUTA_LLM_URL:-http://ollama:11434/api/chat}
      ESCUTA_SOAP_MODEL: ${ESCUTA_SOAP_MODEL:-qwen3:8b}
      ESCUTA_LAUDO_MODEL: ${ESCUTA_LAUDO_MODEL:-qwen3:8b}
      ESCUTA_VERIFY_MODEL: ${ESCUTA_VERIFY_MODEL:-qwen3:8b}
      ESCUTA_RETENTION_DAYS: ${ESCUTA_RETENTION_DAYS:-90}
      ESCUTA_API_TOKEN: ${ESCUTA_API_TOKEN:-}
      # Preemptação do titular (ollama stop) exige docker.sock; sem ele,
      # use OLLAMA_KEEP_ALIVE=0 durante consultas (runbook do tutorial 12).
      ESCUTA_OLLAMA_CONTAINER: ${ESCUTA_OLLAMA_CONTAINER:-ollama}
      ESCUTA_OLLAMA_MODEL: ${ESCUTA_OLLAMA_MODEL:-gpt-oss:20b}
      ESCUTA_UNLOAD_TITULAR_ON_JOB: ${ESCUTA_UNLOAD_TITULAR_ON_JOB:-0}
      SPEACHES_API_KEY: ${SPEACHES_API_KEY:-}
      WLK_API_TOKEN: ${WLK_API_TOKEN}
      AI_API_KEY: ${AI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - /srv/ai/clinical:/srv/ai/clinical
      - /srv/ai/models/huggingface:/root/.cache/huggingface
      # Para preemptar o titular automaticamente, monte também:
      # - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${ESCUTA_PORT:-8020}:8020"
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - lapan-ai-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG}
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      TZ: ${TZ}
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "True"
    volumes:
      - /srv/ai/open-webui:/app/backend/data
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - lapan-ai-net

  qdrant:
    image: qdrant/qdrant:${QDRANT_TAG}
    container_name: qdrant
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - /srv/ai/qdrant/storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - lapan-ai-net

  neo4j:
    image: neo4j:${NEO4J_TAG}
    container_name: neo4j
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 4G
    volumes:
      - /srv/ai/neo4j/data:/data
      - /srv/ai/neo4j/logs:/logs
      - /srv/ai/neo4j/import:/import
      - /srv/ai/neo4j/plugins:/plugins
      - /srv/ai/neo4j/conf:/conf
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    networks:
      - lapan-ai-net

  ai-api:
    build:
      context: ../../services/ai-api
    container_name: ai-api
    restart: unless-stopped
    depends_on:
      - ollama
      - qdrant
      - neo4j
    environment:
      TZ: ${TZ}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_ALLOW_LOCAL_HEALTHZ: ${AI_API_ALLOW_LOCAL_HEALTHZ:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      NEO4J_HTTP_URL: http://neo4j:7474/db/neo4j/tx/commit
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH}
      RAG_COLLECTION: ${RAG_COLLECTION:-research_chunks_bge_m3}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_CONFIG: /srv/ai/rag/configs/research-platform.yaml
      HF_HUB_CACHE: /home/app/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /home/app/.cache/huggingface/hub
    volumes:
      - /srv/ai/rag:/srv/ai/rag:ro
      - /srv/ai/ingest:/srv/ai/ingest:ro
      - /srv/ai/models/huggingface:/home/app/.cache/huggingface
    ports:
      - "127.0.0.1:${AI_API_PORT:-8088}:8080"
    networks:
      - lapan-ai-net

  jupyter:
    build:
      context: ./jupyter
      args:
        JUPYTER_BASE_TAG: ${JUPYTER_BASE_TAG}
    container_name: jupyter
    restart: unless-stopped
    depends_on:
      - ollama
      - qdrant
      - neo4j
    environment:
      TZ: ${TZ}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      NEO4J_HTTP_URL: http://neo4j:7474/db/neo4j/tx/commit
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH}
      RAG_COLLECTION: ${RAG_COLLECTION:-research_chunks_bge_m3}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      HF_HUB_CACHE: /home/jovyan/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /home/jovyan/.cache/huggingface/hub
    volumes:
      - /srv/ai/jupyter/work:/home/jovyan/work
      - /srv/ai/ingest:/srv/ai/ingest
      - /srv/ai/rag:/srv/ai/rag
      - /srv/ai/models/huggingface:/home/jovyan/.cache/huggingface/hub
      - /home/hugo/proxmox-lapan-ai-setup:/home/jovyan/proxmox-lapan-ai-setup:ro
      - /srv/ai/zotero:/srv/ai/zotero:ro
    ports:
      - "127.0.0.1:8888:8888"
    command: >
      start-notebook.py
      --ServerApp.token=${JUPYTER_TOKEN}
      --ServerApp.allow_remote_access=True
    networks:
      - lapan-ai-net

  openclaw:
    build:
      context: ./openclaw
    container_name: openclaw
    restart: unless-stopped
    depends_on:
      - ollama
      - ai-api
      - searxng
      - qdrant
      - neo4j
    environment:
      TZ: ${TZ}
      OPENCLAW_PORT: ${OPENCLAW_PORT:-18789}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_AUTH_TOKEN:?defina OPENCLAW_AUTH_TOKEN no .env (openssl rand -hex 32)}
      OPENCLAW_AUTH_TOKEN: ${OPENCLAW_AUTH_TOKEN}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      AI_API_BASE_URL: http://ai-api:8080/v1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      NEO4J_AUTH: ${NEO4J_AUTH:-}
      # PAT fine-grained opcional (GitHub MCP + gh CLI); sem ele o shim usa o
      # oauth_token do hosts.yml do gh montado do host.
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      # gh CLI autenticado pelo hosts.yml do host.
      GH_CONFIG_DIR: /home/node/host_home/.config/gh
    volumes:
      - /srv/ai/openclaw/data:/home/node/.openclaw
      - /srv/ai/openclaw/workspace:/home/node/workspace
      - /home/hugo/Zotero:/home/node/Zotero:rw
      - /srv/ai/zotero:/srv/ai/zotero:rw
      - /home/hugo/.local/bin/agy:/usr/local/bin/agy:ro
      - /home/hugo/.gemini:/home/node/.gemini:rw
      - /home/hugo/.claude:/home/node/.claude:rw
      - /home/hugo/.claude.json:/home/node/.claude.json:rw
      - /home/hugo/.gitconfig:/home/node/.gitconfig:ro
      - /home/hugo/.git-credentials:/home/node/.git-credentials:ro
      - /home/hugo:/home/node/host_home:rw
    ports:

      - "127.0.0.1:${OPENCLAW_PORT:-18789}:18789"
    networks:
      - lapan-ai-net

  # --- SearXNG: meta-busca self-hosted para o web_search do OpenClaw ---
  # Interno à rede lapan-ai-net (sem porta exposta); requer format json,
  # já habilitado em ./searxng/searxng-settings.yml.
  searxng:
    image: searxng/searxng:latest
    container_name: lapan-ai-searxng
    restart: unless-stopped
    volumes:
      - ./searxng/searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - lapan-ai-net

networks:
  lapan-ai-net:
    driver: bridge

